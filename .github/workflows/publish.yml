name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Check format
        run: deno fmt --check

      - name: Run Linter
        run: deno lint

      - name: Run Tests
        run: deno test --allow-all --coverage=cov/

      - name: Generate coverage report
        run: deno coverage --lcov cov > cov.lcov

      - name: Upload coverage to Coveralls.io
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Generated by GitHub.
          path-to-lcov: cov.lcov

      - name: Publish package
        run: |
          deno run -A ./scripts/prep-jsr.ts ${{ github.ref }}
          deno publish -c ./src/deno.json --allow-dirty

      - name: build npm package
        run: deno run -A ./scripts/build_npm.ts ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: publish npm package
        run: |
          cd npm
          npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Clear README Image Cache
        run:  deno task clear-cache