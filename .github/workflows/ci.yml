name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  ci:
    name: CI (lint, build, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Check formatting
        run: deno fmt --check

      - name: Run Linter
        run: deno lint

      - name: Run Tests
        run: deno test

      - name: Dry-Run Publish
        run: |
          deno run -A ./scripts/prep-jsr.ts refs/tags/v0.0.0
          deno publish -c ./src/deno.json --dry-run --allow-dirty

      - name: build npm package
        run: deno run -A ./scripts/build_npm.ts refs/tags/v0.0.0